name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate daily at midnight UTC
  workflow_dispatch: {}    # allows manual "Run workflow" trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: gautamrs224-r
          outputs: |
            dist/snake-dark.svg?color_snake=%23C084FC&color_dots=%230B0212,%232D0B57,%234C1D95,%237C3AED,%23E9D5FF
            dist/snake-light.svg?palette=github-light&color_snake=%237C3AED

      - name: push generated snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
