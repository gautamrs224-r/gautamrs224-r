<svg width="830" height="335" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#7C3AED" stroke-opacity="0.06">
    <path d="M0,70 H900 M0,210 H900" stroke-width="1"/>
    <path d="M225,0 V360 M450,0 V360 M675,0 V360" stroke-width="1"/>
  </g>
  <circle cx="450" cy="140" r="220" fill="url(#ambient)"/>

  <!-- transmission lines from tower to each channel -->
  <line x1="450" y1="130" x2="200" y2="70" stroke="#F97362" stroke-opacity="0.35" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="450" y1="130" x2="700" y2="70" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="450" y1="130" x2="200" y2="210" stroke="#E5E7EB" stroke-opacity="0.35" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="450" y1="130" x2="700" y2="210" stroke="#C084FC" stroke-opacity="0.35" stroke-width="1.3" stroke-dasharray="4,4"/>

  <!-- traveling signal particles -->
  <circle r="3" fill="#F97362">
    <animateMotion dur="3.0s" repeatCount="indefinite" path="M450,130 L200,70"/>
  </circle>
  <circle r="3" fill="#38BDF8">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M450,130 L700,70"/>
  </circle>
  <circle r="3" fill="#E5E7EB">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M450,130 L200,210"/>
  </circle>
  <circle r="3" fill="#C084FC">
    <animateMotion dur="4.8s" repeatCount="indefinite" path="M450,130 L700,210"/>
  </circle>

  <!-- tower core -->
  <g transform="translate(450,130)">
    <circle r="42" fill="url(#coreGlow)">
      <animate attributeName="r" values="36;48;36" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="#0B0212" stroke="#C084FC" stroke-width="1.8"/>
    <path d="M-8,-3 L-8,5 M0,-7 L0,7 M8,-3 L8,5" stroke="#E9D5FF" stroke-width="1.6" stroke-linecap="round"/>
    <circle r="30" fill="none" stroke="#C084FC" stroke-width="1.2" opacity="0.6">
      <animate attributeName="r" values="26;40" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- broadcast channel nodes -->
  <g transform="translate(200,70)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3.6s" begin="0.0s" repeatCount="indefinite" additive="sum"/>
      <circle r="28" fill="#F97362" opacity="0.18">
        <animate attributeName="opacity" values="0.12;0.28;0.12" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="19" fill="#0B0212" stroke="#F97362" stroke-width="1.8"/>
      <text y="5" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#F97362">@</text>
    </g>
    <text y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#C4B5FD" letter-spacing="1">EMAIL</text>
  </g>
  <g transform="translate(700,70)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="4.1s" begin="0.3s" repeatCount="indefinite" additive="sum"/>
      <circle r="28" fill="#38BDF8" opacity="0.18">
        <animate attributeName="opacity" values="0.12;0.28;0.12" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle r="19" fill="#0B0212" stroke="#38BDF8" stroke-width="1.8"/>
      <text y="5" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#38BDF8">in</text>
    </g>
    <text y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#C4B5FD" letter-spacing="1">LINKEDIN</text>
  </g>
  <g transform="translate(200,210)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4.6s" begin="0.6s" repeatCount="indefinite" additive="sum"/>
      <circle r="28" fill="#E5E7EB" opacity="0.18">
        <animate attributeName="opacity" values="0.12;0.28;0.12" dur="3.0s" repeatCount="indefinite"/>
      </circle>
      <circle r="19" fill="#0B0212" stroke="#E5E7EB" stroke-width="1.8"/>
      <text y="5" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#E5E7EB">GH</text>
    </g>
    <text y="-30" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#C4B5FD" letter-spacing="1">GITHUB</text>
  </g>
  <g transform="translate(700,210)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="5.1s" begin="0.9s" repeatCount="indefinite" additive="sum"/>
      <circle r="28" fill="#C084FC" opacity="0.18">
        <animate attributeName="opacity" values="0.12;0.28;0.12" dur="3.3s" repeatCount="indefinite"/>
      </circle>
      <circle r="19" fill="#0B0212" stroke="#C084FC" stroke-width="1.8"/>
      <text y="5" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#C084FC">PF</text>
    </g>
    <text y="-30" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#C4B5FD" letter-spacing="1">PORTFOLIO</text>
  </g>

  <text x="450" y="300" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#7C3AED" letter-spacing="2">STATUS</text>

  <!-- cycling caption -->
    <text x="450" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" font-weight="600" fill="#E9D5FF" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0392;0.2745;0.3137;1.0000" dur="10.2s" begin="0s" repeatCount="indefinite"/>
      TRANSMITTING ON 4 CHANNELS<tspan><animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0s" repeatCount="indefinite"/> |</tspan>
    </text>
    <text x="450" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" font-weight="600" fill="#E9D5FF" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3725;0.6078;0.6471;1.0000" dur="10.2s" begin="0s" repeatCount="indefinite"/>
      OPEN TO OPPORTUNITIES<tspan><animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0s" repeatCount="indefinite"/> |</tspan>
    </text>
    <text x="450" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" font-weight="600" fill="#E9D5FF" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.7059;0.9412;0.9804;1.0000" dur="10.2s" begin="0s" repeatCount="indefinite"/>
      LET'S BUILD SOMETHING<tspan><animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0s" repeatCount="indefinite"/> |</tspan>
    </text>
</svg>
