<svg width="830" height="300" viewBox="0 0 900 325" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ambient" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#7C3AED" stroke-opacity="0.06">
    <path d="M0,60 H900 M0,180 H900" stroke-width="1"/>
    <path d="M225,0 V325 M450,0 V325 M675,0 V325" stroke-width="1"/>
  </g>
  <circle cx="450" cy="120" r="200" fill="url(#ambient)"/>

  <!-- radar ping rings, transmitting outward -->
  <circle cx="450" cy="120" r="20" fill="none" stroke="#C084FC" stroke-width="1.6" opacity="0.8">
    <animate attributeName="r" values="20;150" dur="4.2s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="4.2s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="120" r="20" fill="none" stroke="#C084FC" stroke-width="1.6" opacity="0.8">
    <animate attributeName="r" values="20;150" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="120" r="20" fill="none" stroke="#C084FC" stroke-width="1.6" opacity="0.8">
    <animate attributeName="r" values="20;150" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- orbiting signal particles -->
  <circle r="3.2" fill="#E9D5FF">
    <animateMotion dur="7.5s" repeatCount="indefinite" path="M450,60 A60,60 0 1,1 449,60"/>
  </circle>
  <circle r="3.2" fill="#C084FC">
    <animateMotion dur="9.5s" repeatCount="indefinite" path="M450,25 A95,95 0 1,1 449,25"/>
  </circle>
  <circle r="3.2" fill="#A855F7">
    <animateMotion dur="12.0s" repeatCount="indefinite" path="M450,-10 A130,130 0 1,1 449,-10"/>
  </circle>

  <!-- beacon core -->
  <g transform="translate(450,120)">
    <circle r="40" fill="url(#coreGlow)">
      <animate attributeName="r" values="34;46;34" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="#0B0212" stroke="#C084FC" stroke-width="1.8"/>
    <path d="M-7,-2 L-7,4 M0,-6 L0,6 M7,-2 L7,4" stroke="#E9D5FF" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- status line -->
  <text x="450" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#7C3AED" letter-spacing="2">STATUS</text>

  <!-- cycling caption -->
    <text x="450" y="250" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="600" fill="#E9D5FF" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0417;0.2708;0.3125;1.0000" dur="9.600000000000001s" begin="0s" repeatCount="indefinite"/>
      OPEN TO OPPORTUNITIES<tspan><animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0s" repeatCount="indefinite"/> |</tspan>
    </text>
    <text x="450" y="250" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="600" fill="#E9D5FF" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3750;0.6042;0.6458;1.0000" dur="9.600000000000001s" begin="0s" repeatCount="indefinite"/>
      LET'S BUILD SOMETHING<tspan><animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0s" repeatCount="indefinite"/> |</tspan>
    </text>
    <text x="450" y="250" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="600" fill="#E9D5FF" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.7083;0.9375;0.9792;1.0000" dur="9.600000000000001s" begin="0s" repeatCount="indefinite"/>
      REACH OUT ANYTIME<tspan><animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0s" repeatCount="indefinite"/> |</tspan>
    </text>
</svg>
