  <!-- hidden constellation, fades in and out slowly -->
  <g opacity="0" stroke-opacity="0.5">
    <animate attributeName="opacity" values="0;0.35;0.35;0" keyTimes="0;0.3;0.7;1" dur="9s" repeatCount="indefinite"/>
<line x1="452" y1="23" x2="801" y2="101" stroke="#C084FC" stroke-width="0.8"/>
<line x1="801" y1="101" x2="653" y2="241" stroke="#C084FC" stroke-width="0.8"/>
<line x1="653" y1="241" x2="719" y2="180" stroke="#C084FC" stroke-width="0.8"/>
<line x1="719" y1="180" x2="87" y2="69" stroke="#C084FC" stroke-width="0.8"/>
  </g>

  <circle cx="450" cy="100" r="150" fill="url(#portalGlow)">
    <animate attributeName="r" values="140;168;140" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating concentric portal rings -->
  <circle cx="450" cy="100" r="95" fill="none" stroke="#E9D5FF" stroke-width="1.8" stroke-dasharray="none" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" values="0 450 100;360 450 100" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="100" r="70" fill="none" stroke="#C084FC" stroke-width="1.6" stroke-dasharray="6,6" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" values="360 450 100;0 450 100" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="100" r="46" fill="none" stroke="#A855F7" stroke-width="1.4" stroke-dasharray="3,3" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" values="0 450 100;360 450 100" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="100" r="28" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" values="360 450 100;0 450 100" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- core -->
  <circle cx="450" cy="100" r="20" fill="#0B0212" stroke="#E9D5FF" stroke-width="1.6"/>
  <text x="450" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#E9D5FF" letter-spacing="1">RG</text>

  <!-- typewriter-revealed signature with drawing underline -->
  <g clip-path="url(#clipSig)">
    <text x="320" y="240" font-family="'Courier New', monospace" font-size="24" font-weight="700" fill="#EDE4FF" letter-spacing="1">RAVISHANKAR GAUTAM</text>
  </g>
  <line x1="320" y1="250" x2="320" y2="250" stroke="#C084FC" stroke-width="2">
    <animate attributeName="x2" values="320;580;580;320" keyTimes="0;0.12;0.85;1" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- cycling sign-off -->
    <text x="450" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#C4B5FD" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0455;0.4545;0.5000;1.0000" dur="8.8s" begin="0s" repeatCount="indefinite"/>
      Thanks for stopping by<tspan><animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0s" repeatCount="indefinite"/> _</tspan></text>
    <text x="450" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#C4B5FD" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5000;0.5455;0.9545;1.0000" dur="8.8s" begin="0s" repeatCount="indefinite"/>
      Let's build something great<tspan><animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="0s" repeatCount="indefinite"/> _</tspan></text>
</svg>
