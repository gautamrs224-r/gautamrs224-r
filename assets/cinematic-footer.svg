<svg width="830" height="325" viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipSig">
      <rect x="315" y="215" width="0" height="34">
        <animate attributeName="width" values="0;260;260;0" keyTimes="0;0.12;0.85;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- starfield -->
  <circle cx="674" cy="43" r="0.8" fill="#E9D5FF" opacity="0.3">
