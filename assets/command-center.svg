<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A855F7"/>
    </marker>
  </defs>

  <!-- ambient grid, transparent canvas -->
  <g stroke="#7C3AED" stroke-opacity="0.08">
    <path d="M0,40 H900 M0,120 H900 M0,200 H900 M0,280 H900 M0,360 H900" stroke-width="1"/>
    <path d="M100,0 V430 M300,0 V430 M500,0 V430 M700,0 V430" stroke-width="1"/>
  </g>

  <circle cx="450" cy="30" r="180" fill="url(#glow)">
    <animate attributeName="r" values="150;200;150" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- vertical scanning beam -->
  <rect x="0" y="0" width="12" height="430" fill="url(#scan)">
    <animate attributeName="x" values="0;888;0" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- ===================== HEADER ===================== -->
  <text x="30" y="34" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#E9D5FF">RAVISHANKAR@DEVELOPER <tspan fill="#A855F7">~</tspan> SYSTEM STATUS<tspan fill="#C084FC"><animate attributeName="opacity" values="1;0;1" dur="1s" begin="0s" repeatCount="indefinite"/> _</tspan></text>
  <line x1="30" y1="52" x2="870" y2="52" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1"/>

  <!-- ===================== METADATA ===================== -->
  <g font-family="'Courier New', monospace" font-size="14">
    <text x="30" y="86" fill="#7C3AED" letter-spacing="1">ROLE</text>
    <text x="150" y="86" fill="#EDE4FF">Full Stack Developer</text>

    <text x="30" y="112" fill="#7C3AED" letter-spacing="1">STATUS</text>
    <text x="150" y="112" fill="#EDE4FF">Open to Opportunities</text>
    <circle cx="335" cy="108" r="4" fill="#C084FC">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <text x="30" y="138" fill="#7C3AED" letter-spacing="1">LOCATION</text>
    <text x="150" y="138" fill="#EDE4FF">Mumbai, India</text>

    <text x="450" y="86" fill="#7C3AED" letter-spacing="1">FOCUS</text>
    <text x="540" y="86" fill="#EDE4FF">Full Stack Development</text>

    <text x="450" y="112" fill="#7C3AED" letter-spacing="1">GOAL</text>
    <text x="540" y="112" fill="#EDE4FF">Production-ready Engineer</text>
  </g>

  <line x1="30" y1="160" x2="870" y2="160" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1"/>

  <!-- ===================== PRIMARY STACK FLOW ===================== -->
  <text x="30" y="192" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#A855F7">PRIMARY STACK</text>

  <g font-family="'Courier New', monospace" font-size="14" fill="#EDE4FF">
    <rect x="30" y="212" width="110" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="85" y="234" text-anchor="middle">JavaScript</text>

    <rect x="185" y="212" width="90" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="230" y="234" text-anchor="middle">React</text>

    <rect x="320" y="212" width="90" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="365" y="234" text-anchor="middle">Node</text>

    <rect x="455" y="212" width="100" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="505" y="234" text-anchor="middle">Express</text>
  </g>

  <!-- connecting arrows -->
  <path id="p1" d="M140,229 H185" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <path id="p2" d="M275,229 H320" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <path id="p3" d="M410,229 H455" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <path id="p4" d="M505,246 V275 H365 V246" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>

  <!-- data-flow particle traveling the whole chain, looping -->
  <circle r="3.2" fill="#C084FC">
    <animateMotion dur="4s" repeatCount="indefinite"
      path="M140,229 H275 H410 H505 V275 H365" />
  </circle>

  <rect x="315" y="284" width="100" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="365" y="306" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#EDE4FF">MongoDB</text>

  <line x1="30" y1="340" x2="870" y2="340" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1"/>

  <!-- ===================== CURRENTLY LEARNING ===================== -->
  <text x="30" y="372" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#A855F7">CURRENTLY LEARNING</text>

  <g transform="translate(0,384)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0500;0.8125;0.8750;1.0000" dur="8.0s" begin="0s" repeatCount="indefinite"/>
      <rect x="30" y="0" width="95" height="30" rx="6" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="77.5" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#C084FC">Python</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0625;0.1125;0.8125;0.8750;1.0000" dur="8.0s" begin="0s" repeatCount="indefinite"/>
      <rect x="150" y="0" width="105" height="30" rx="6" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="202.5" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#C084FC">MySQL</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1250;0.1750;0.8125;0.8750;1.0000" dur="8.0s" begin="0s" repeatCount="indefinite"/>
      <rect x="280" y="0" width="130" height="30" rx="6" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="345.0" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#C084FC">PostgreSQL</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1875;0.2375;0.8125;0.8750;1.0000" dur="8.0s" begin="0s" repeatCount="indefinite"/>
      <rect x="430" y="0" width="100" height="30" rx="6" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="480.0" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#C084FC">Next.js</text>
    </g>
  </g>

  <line x1="30" y1="410" x2="870" y2="410" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1"/>
</svg>
