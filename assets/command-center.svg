<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A855F7"/>
    </marker>
  </defs>

  <!-- ambient grid, transparent canvas -->
  <g stroke="#7C3AED" stroke-opacity="0.08">
    <path d="M0,40 H900 M0,120 H900 M0,200 H900 M0,280 H900 M0,360 H900 M0,440 H900" stroke-width="1"/>
    <path d="M100,0 V500 M300,0 V500 M500,0 V500 M700,0 V500" stroke-width="1"/>
  </g>

  <circle cx="450" cy="30" r="180" fill="url(#glow)">
    <animate attributeName="r" values="150;200;150" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ===================== HEADER ===================== -->
  <text x="30" y="34" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#E9D5FF">RAVISHANKAR@DEVELOPER <tspan fill="#A855F7">~</tspan> SYSTEM STATUS<tspan fill="#C084FC"><animate attributeName="opacity" values="1;0;1" dur="1s" begin="0s" repeatCount="indefinite"/> _</tspan></text>
  <line x1="30" y1="52" x2="870" y2="52" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1"/>

  <!-- ===================== METADATA ===================== -->
  <g font-family="'Courier New', monospace" font-size="14">
    <text x="30" y="86" fill="#7C3AED" letter-spacing="1">ROLE</text>
    <text x="150" y="86" fill="#EDE4FF">Full Stack Developer</text>

    <text x="30" y="112" fill="#7C3AED" letter-spacing="1">STATUS</text>
    <text x="150" y="112" fill="#EDE4FF">Open to Opportunities</text>
    <circle cx="335" cy="108" r="4" fill="#C084FC">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <text x="30" y="138" fill="#7C3AED" letter-spacing="1">LOCATION</text>
    <text x="150" y="138" fill="#EDE4FF">Mumbai, India</text>

    <text x="450" y="86" fill="#7C3AED" letter-spacing="1">FOCUS</text>
    <text x="540" y="86" fill="#EDE4FF">Full Stack Development</text>

    <text x="450" y="112" fill="#7C3AED" letter-spacing="1">GOAL</text>
    <text x="540" y="112" fill="#EDE4FF">Production-ready Engineer</text>
  </g>

  <line x1="30" y1="160" x2="870" y2="160" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1"/>

  <!-- ===================== PRIMARY STACK ===================== -->
  <text x="30" y="192" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#A855F7">PRIMARY STACK</text>

  <!-- languages -->
  <text x="30" y="210" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.5" fill="#7C3AED" opacity="0.8">LANGUAGES</text>
  <g font-family="'Courier New', monospace" font-size="14" fill="#EDE4FF">
    <rect x="30" y="216" width="110" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="85" y="238" text-anchor="middle">JavaScript</text>
    <rect x="160" y="216" width="90" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="205" y="238" text-anchor="middle">Python</text>
  </g>

  <!-- framework flow -->
  <text x="30" y="270" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.5" fill="#7C3AED" opacity="0.8">FRAMEWORK FLOW</text>
  <g font-family="'Courier New', monospace" font-size="14" fill="#EDE4FF">
    <rect x="30" y="276" width="90" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="75" y="298" text-anchor="middle">React</text>
    <rect x="140" y="276" width="90" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="185" y="298" text-anchor="middle">Node</text>
    <rect x="250" y="276" width="100" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="300" y="298" text-anchor="middle">Express</text>
  </g>
  <path d="M120,293 H140" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <path d="M230,293 H250" stroke="#7C3AED" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>

  <!-- data-flow particle travels the framework chain, loops -->
  <circle r="3.2" fill="#C084FC">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M75,293 H185 H300" />
  </circle>

  <!-- databases -->
  <text x="30" y="330" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.5" fill="#7C3AED" opacity="0.8">DATABASES</text>
  <g font-family="'Courier New', monospace" font-size="14" fill="#EDE4FF">
    <rect x="30" y="336" width="100" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="80" y="358" text-anchor="middle">MongoDB</text>
    <rect x="150" y="336" width="90" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="195" y="358" text-anchor="middle">MySQL</text>
    <rect x="260" y="336" width="110" height="34" rx="6" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="315" y="358" text-anchor="middle">PostgreSQL</text>
  </g>
  <!-- branch from Express down to each database -->
  <path d="M300,310 V322 L80,322 V336" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.7" marker-end="url(#arrow)" fill="none"/>
  <path d="M300,310 V322 L195,322 V336" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.7" marker-end="url(#arrow)" fill="none"/>
  <path d="M300,310 V336" stroke="#7C3AED" stroke-width="1.2" stroke-opacity="0.7" marker-end="url(#arrow)" fill="none"/>

  <line x1="30" y1="390" x2="870" y2="390" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1"/>

  <!-- ===================== CURRENTLY LEARNING ===================== -->
  <text x="30" y="422" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#A855F7">CURRENTLY LEARNING</text>

  <g transform="translate(0,434)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0000;0.0500;0.8125;0.8750;1.0000" dur="8.0s" begin="0s" repeatCount="indefinite"/>
      <rect x="30" y="0" width="110" height="30" rx="6" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="85.0" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#C084FC">TypeScript</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0625;0.1125;0.8125;0.8750;1.0000" dur="8.0s" begin="0s" repeatCount="indefinite"/>
      <rect x="155" y="0" width="90" height="30" rx="6" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="200.0" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#C084FC">Next.js</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1250;0.1750;0.8125;0.8750;1.0000" dur="8.0s" begin="0s" repeatCount="indefinite"/>
      <rect x="260" y="0" width="80" height="30" rx="6" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="300.0" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#C084FC">Java</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1875;0.2375;0.8125;0.8750;1.0000" dur="8.0s" begin="0s" repeatCount="indefinite"/>
      <rect x="355" y="0" width="90" height="30" rx="6" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="400.0" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#C084FC">Redux</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2500;0.3000;0.8125;0.8750;1.0000" dur="8.0s" begin="0s" repeatCount="indefinite"/>
      <rect x="460" y="0" width="95" height="30" rx="6" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="507.5" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#C084FC">GraphQL</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3125;0.3625;0.8125;0.8750;1.0000" dur="8.0s" begin="0s" repeatCount="indefinite"/>
      <rect x="570" y="0" width="90" height="30" rx="6" fill="none" stroke="#7C3AED" stroke-opacity="0.55" stroke-width="1.2"/>
      <text x="615.0" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#C084FC">Docker</text>
    </g>
  </g>

  <line x1="30" y1="478" x2="870" y2="478" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="1"/>
</svg>
